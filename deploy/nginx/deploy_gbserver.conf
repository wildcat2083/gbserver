# /etc/nginx/sites-available/gbserver.conf
#
# Reverse proxy for the headless Game Boy server, serving two audiences:
#
#   gbserver.wulfpax-labs.com          - internet-facing, through a
#                                         Cloudflare Tunnel (no port
#                                         forwarding; see deploy/cloudflared/)
#   gbserver-internal.wulfpax-labs.com - LAN-only, HTTPS with the internal
#                                         CA certificate (wulfpax-labs-DC-CA)
#
# The actual proxy behavior (HTTP routes, WebSocket upgrade handling) is
# identical for both audiences and lives in one shared file, included by
# both server blocks below, so it only needs to be maintained once:
#   /etc/nginx/snippets/gbserver-locations.conf
upstream gbserver {
    server 127.0.0.1:8080;
}

# Requests the internet-facing hostname refuses outright. ROM uploads and
# ROM deletes are LAN-only: without this, any anonymous visitor could
# create a room, become its controller, and fill the Pi's disk with
# uploads or delete library ROMs. Matched against the normalized,
# percent-decoded $uri, so encoded slashes or doubled slashes don't slip
# past. Covers both the shared-game paths and /r/<code>/ room paths.
# Remove a line here if you ever want to allow that action publicly.
map "$request_method:$uri" $gbserver_public_denied {
    default                                        0;
    "~^POST:(/r/[A-Za-z0-9]+)?/api/upload$"        1;
    "~^DELETE:(/r/[A-Za-z0-9]+)?/api/rom/"         1;
}
# Catch-alls: requests for any hostname not listed below (a bare IP, a
# stale DNS record, a leftover port forward pointing at 80/443) get the
# connection dropped instead of falling through to the first server block -
# which would otherwise be the LAN-only site with the admin dashboard.
server {
    listen 80 default_server;
    return 444;
}
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}
# Plain HTTP on port 80 only redirects LAN users to HTTPS. The public
# hostname no longer needs port 80 (or 443): it's served through the
# Cloudflare Tunnel below, so no port forwarding is required on the router.
server {
    listen 80;
    server_name gbserver-internal.wulfpax-labs.com;
    location / {
        return 301 https://$host$request_uri;
    }
}
# --- Internet-facing: via Cloudflare Tunnel ---------------------------------
# cloudflared (running on this machine) receives visitors' requests from
# Cloudflare over an outbound connection and hands them to this block.
# Cloudflare terminates TLS for visitors, so this listens on plain HTTP,
# and only on loopback - nothing outside this machine can reach it.
# Pointed at this block rather than straight at gunicorn so the public
# restrictions below (no uploads/deletes, no dashboard) still apply.
server {
    listen 127.0.0.1:8081;
    server_name gbserver.wulfpax-labs.com;

    # Every request arrives from cloudflared on 127.0.0.1. Take the real
    # visitor IP from the header Cloudflare sets (and overwrites if a client
    # tries to supply it), so gbserver's rate limits, IP blocks and the
    # dashboard see real addresses. Without this, every visitor would be
    # 127.0.0.1 - which gbserver exempts from rate limiting.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 8m;

    # JSON body so the player UI shows a readable message instead of a
    # parse error (both upload and delete handlers display data.error).
    if ($gbserver_public_denied) {
        return 403 '{"error":"Adding or deleting ROMs is only available on the local network."}';
    }
    default_type application/json;

    include /etc/nginx/snippets/gbserver-locations.conf;

    # Admin dashboard is LAN-only. 404 rather than 403, so the public
    # hostname doesn't even confirm an admin panel exists. Longest-prefix
    # matching gives these priority over the include's "location /".
    location /dashboard {
        return 404;
    }
    location /api/dashboard/ {
        return 404;
    }
    location /api/admin/ {
        return 404;
    }
}
# --- LAN-only: internal CA certificate -------------------------------------
server {
    listen 443 ssl;
    server_name gbserver-internal.wulfpax-labs.com;
    ssl_certificate     /etc/nginx/certs/gbserver.crt;
    ssl_certificate_key /etc/nginx/certs/gbserver.key;
    client_max_body_size 8m;
    include /etc/nginx/snippets/gbserver-locations.conf;
}
