# /etc/nginx/sites-available/gbserver.conf
#
# Reverse proxy for the headless Game Boy server, serving two audiences
# on two separate hostnames with two separate certificates:
#
#   gbserver.wulfpax-labs.com          - internet-facing, public
#                                         Let's Encrypt certificate
#   gbserver-internal.wulfpax-labs.com - LAN-only, internal CA
#                                         certificate (wulfpax-labs-DC-CA)
#
# nginx picks the right server block (and therefore the right cert) via
# SNI - the hostname the client asks for during the TLS handshake, before
# any encrypted traffic flows - so both blocks coexist on the same port
# 443 with no conflict.
#
# The actual proxy behavior (HTTP routes, WebSocket upgrade handling) is
# identical for both audiences and lives in one shared file, included by
# both server blocks below, so it only needs to be maintained once:
#   /etc/nginx/snippets/gbserver-locations.conf
upstream gbserver {
    server 127.0.0.1:8080;
}

# Requests the internet-facing hostname refuses outright. ROM uploads and
# ROM deletes are LAN-only: without this, any anonymous visitor could
# create a room, become its controller, and fill the Pi's disk with
# uploads or delete library ROMs. Matched against the normalized,
# percent-decoded $uri, so encoded slashes or doubled slashes don't slip
# past. Covers both the shared-game paths and /r/<code>/ room paths.
# Remove a line here if you ever want to allow that action publicly.
map "$request_method:$uri" $gbserver_public_denied {
    default                                        0;
    "~^POST:(/r/[A-Za-z0-9]+)?/api/upload$"        1;
    "~^DELETE:(/r/[A-Za-z0-9]+)?/api/rom/"         1;
}
server {
    listen 80;
    server_name gbserver.wulfpax-labs.com gbserver-internal.wulfpax-labs.com;
    # Let's Encrypt's HTTP-01 validation (and later, renewal) needs to
    # reach this path over plain HTTP - carved out here, BEFORE the
    # catch-all redirect below, so it isn't bounced to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
# --- Internet-facing: public Let's Encrypt certificate --------------------
server {
    listen 443 ssl;
    server_name gbserver.wulfpax-labs.com;
    ssl_certificate     /etc/letsencrypt/live/gbserver.wulfpax-labs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gbserver.wulfpax-labs.com/privkey.pem;
    # ROM uploads can be a couple MB; raise the body size limit a bit.
    client_max_body_size 8m;

    # JSON body so the player UI shows a readable message instead of a
    # parse error (both upload and delete handlers display data.error).
    if ($gbserver_public_denied) {
        return 403 '{"error":"Adding or deleting ROMs is only available on the local network."}';
    }
    default_type application/json;

    include /etc/nginx/snippets/gbserver-locations.conf;

    # Admin dashboard is LAN-only - not reachable from the public hostname
    # at all. These are plain prefix locations, which nginx matches by
    # longest-prefix-wins regardless of file order, so they correctly
    # take priority over the general "location /" proxy_pass pulled in by
    # the include above without needing to be placed in any particular
    # spot relative to it. 404 rather than 403, specifically so this
    # doesn't even confirm an admin panel exists to anyone probing the
    # public hostname.
    location /dashboard {
        return 404;
    }
    location /api/dashboard/ {
        return 404;
    }
    location /api/admin/ {
        return 404;
    }
}
# --- LAN-only: internal CA certificate -------------------------------------
server {
    listen 443 ssl;
    server_name gbserver-internal.wulfpax-labs.com;
    ssl_certificate     /etc/nginx/certs/gbserver.crt;
    ssl_certificate_key /etc/nginx/certs/gbserver.key;
    client_max_body_size 8m;
    include /etc/nginx/snippets/gbserver-locations.conf;
}
