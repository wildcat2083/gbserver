# Shared proxy config for gbserver, included by both the internet-facing
# (Let's Encrypt) and LAN-only (internal CA) server blocks in
# ../gbserver.conf, so the actual proxy behavior only needs to be
# maintained in one place.
#
# Host and X-Forwarded-Host are pinned to the matched server block's own
# name ($server_name), never the client-supplied Host ($host) - and
# X-Forwarded-Host is always overwritten. gbserver trusts X-Forwarded-Host
# (ProxyFix x_host=1) and uses the hostname to decide what's "internal"
# (e.g. GBSERVER_DEBUGGER=internal). Passing a client's own
# X-Forwarded-Host through would let a public visitor claim to be
# gbserver-internal.wulfpax-labs.com.
location / {
    proxy_pass http://gbserver;
    proxy_set_header Host $server_name;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /ws {
    proxy_pass http://gbserver;
    proxy_http_version 1.1;
    # WebSocket upgrade handshake
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $server_name;
    proxy_set_header X-Forwarded-Host $server_name;
    # Without these two, ProxyFix on the Python side has nothing to
    # correct from and falls back to nginx's own loopback address -
    # every WebSocket client would show up as 127.0.0.1 on the admin
    # dashboard without them.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Strip the client's permessage-deflate offer before it reaches the
    # backend - double-compresses our own already-compressed video
    # frames and corrupts them otherwise.
    proxy_set_header Sec-WebSocket-Extensions "";
    # This is a long-lived streaming connection (video+audio+input) -
    # don't let nginx time it out or buffer it.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
# Private room sessions: /r/<code>/ws - same handling as /ws above, just
# matched with a regex since a plain prefix location for /ws would only
# ever match URIs that literally start with "/ws".
location ~ ^/r/[A-Za-z0-9]+/ws$ {
    proxy_pass http://gbserver;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $server_name;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Sec-WebSocket-Extensions "";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
